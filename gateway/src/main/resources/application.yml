server:
  port: 8082

app:
  ws:
    ping-interval-ms: 30000
    send-timeout-ms: 10000
    buffer-limit-bytes: 524288

spring:
  application:
    name: feed-ws
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2s
  kafka:
    bootstrap-servers: localhost:9092

logging:
  structured:
    format:
      console: logstash

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
