server:
  port: 8085

spring:
  application:
    name: user-service
  grpc:
    server:
      port: 9092
  liquibase:
    url: ${APP_DATASOURCE_URL:jdbc:postgresql://localhost:5000/users}
    user: ${APP_DATASOURCE_USERNAME:otus}
    password: ${APP_DATASOURCE_PASSWORD:otus_pass}
    change-log: classpath:/db/changelog/db.changelog-master.xml

app:
  search:
    limit: 50
  datasource:
    master:
      url: ${APP_DATASOURCE_URL:jdbc:postgresql://localhost:5000/users}
      username: ${APP_DATASOURCE_USERNAME:otus}
      password: ${APP_DATASOURCE_PASSWORD:otus_pass}
    slave:
      url: ${APP_DATASOURCE_SLAVE_URL:jdbc:postgresql://localhost:5001/users}
      username: ${APP_DATASOURCE_SLAVE_USERNAME:otus}
      password: ${APP_DATASOURCE_SLAVE_PASSWORD:otus_pass}
    pool-size: ${APP_DATASOURCE_POOL_SIZE:60}
    connection-timeout: 5000

logging:
  structured:
    format:
      console: logstash

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  metrics:
    observations:
      ignored-meters: [LONG_TASK_TIMER]
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
