apiVersion: 1

providers:
  - name: Otus Highload
    folder: Otus
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 10
    options:
      path: /etc/grafana/provisioning/dashboards

  - name: Load Test
    folder: Otus
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 10
    options:
      path: /etc/grafana/load-test-dashboards
