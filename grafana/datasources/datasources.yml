apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  - name: App Metrics
    type: prometheus
    access: proxy
    url: http://app:8080/actuator/prometheus
    isDefault: false

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    jsonData:
      maxLines: 1000

  - name: Tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    isDefault: false
    jsonData:
      httpMethod: GET
      tracesToLogsV2:
        datasourceUid: 'loki'
        filterBySpanID: false
        filterByTraceID: true

  - name: Chat Service Metrics
    type: prometheus
    access: proxy
    url: http://chat-service:8083/actuator/prometheus
    isDefault: false
