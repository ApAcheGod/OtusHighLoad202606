# HAProxy перед кластером PostgreSQL user-db.
# Два виртуальных порта:
#   5000 (pg_write) — только primary: все запросы на запись.
#   5001 (pg_read)  — слейвы round-robin, primary — backup на случай
#                     падения обоих слейвов.
# Проверка здоровья — pgsql-check (probe-запуск как пользователь haproxy;
# сервер отвечает challenge аутентификации -> считается живым).
#
# - nbthread 4 — L4-трафик распределяется по потокам (дефолт: 1);
# - maxconn 10000 — запас по соединениям (под ulimit nofile);
# - timeout client/server 10m — Hikari сам пересоздаёт idle-соединения
#   (maxLifetime 25с), разрывать их балансировщику незачем;

global
    log stdout format raw local0 info
    stats socket /var/lib/haproxy/stats mode 600 level admin
    nbthread 4
    maxconn 10000

defaults
    mode tcp
    log global
    option tcplog
    option dontlognull
    timeout connect 2s
    timeout client 10m
    timeout server 10m
    timeout check 2s
    timeout queue 5s

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 2s
    timeout retry 1s
    hold valid 10s
    hold nx 5s
    hold other 5s
    hold refused 5s
    hold timeout 5s
    hold obsolete 0s

listen pg_write
    bind *:5000
    option pgsql-check user haproxy
    default-server inter 2s fall 3 rise 2 on-marked-down shutdown-sessions resolvers docker resolve-prefer ipv4
    server pg_primary user-db:5432 check maxconn 500

listen pg_read
    bind *:5001
    option pgsql-check user haproxy
    default-server inter 2s fall 3 rise 2 on-marked-down shutdown-sessions resolvers docker resolve-prefer ipv4
    server pg_slave_1 user-db-slave-1:5432 check maxconn 500
    server pg_slave_2 user-db-slave-2:5432 check maxconn 500
    server pg_primary_backup user-db:5432 check backup maxconn 200

listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /
    stats refresh 5s
    stats show-legends
