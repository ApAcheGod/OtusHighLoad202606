server:
  port: 8086

spring:
  application:
    name: post-service
  grpc:
    server:
      port: 9093
  datasource:
    url: ${APP_DATASOURCE_URL:jdbc:postgresql://localhost:5432/otus_highload}
    username: ${APP_DATASOURCE_USERNAME:otus}
    password: ${APP_DATASOURCE_PASSWORD:otus_pass}
    hikari:
      maximum-pool-size: 60
      connection-timeout: 5000

app:
  kafka:
    bootstrap-servers: ${APP_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    send-timeout-ms: 10000

logging:
  structured:
    format:
      console: logstash

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
