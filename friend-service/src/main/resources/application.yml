server:
  port: 8087

spring:
  application:
    name: friend-service
  grpc:
    server:
      port: 9094
    client:
      channel:
        user-service:
          target: localhost:9092
  datasource:
    url: ${APP_DATASOURCE_URL:jdbc:postgresql://localhost:5432/otus_highload}
    username: ${APP_DATASOURCE_USERNAME:otus}
    password: ${APP_DATASOURCE_PASSWORD:otus_pass}
    hikari:
      maximum-pool-size: 25
      connection-timeout: 5000

logging:
  structured:
    format:
      console: logstash

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
