# Nginx-балансировщик перед инстансами user-service.
# 8085 — HTTP (actuator), 9092 — gRPC (h2c). Балансировка least_conn,
# при ошибке upstream-запрос перепосылается на живой инстанс
# (grpc_next_upstream / proxy_next_upstream).
#
# - worker_processes 2 — весь gRPC-трафик идёт по одному HTTP/2-каналу от фасада;
# - worker_connections/rlimit — запас по дескрипторам;
# - keepalive_requests 100000 — реже ротировать upstream-соединения;
# - access_log с buffer/flush — лог ~2 тыс. строк/с, писать их
#   пачками, а не на каждый запрос.

worker_processes 2;
worker_rlimit_nofile 16384;

events {
    worker_connections 4096;
}

http {
    log_format upstream '$remote_addr [$time_local] "$request" $status upstream=$upstream_addr';

    upstream user_service_grpc {
        least_conn;
        server user-service-1:9092 max_fails=3 fail_timeout=10s;
        server user-service-2:9092 max_fails=3 fail_timeout=10s;
        keepalive 64;
        keepalive_requests 100000;
    }

    upstream user_service_http {
        least_conn;
        server user-service-1:8085 max_fails=3 fail_timeout=10s;
        server user-service-2:8085 max_fails=3 fail_timeout=10s;
        keepalive 64;
        keepalive_requests 100000;
    }

    server {
        listen 9092;
        http2 on;
        access_log /dev/stdout upstream buffer=64k flush=5s;

        location / {
            grpc_pass grpc://user_service_grpc;
            grpc_next_upstream error timeout http_502 http_503;
            grpc_next_upstream_tries 2;
            grpc_connect_timeout 2s;
            grpc_read_timeout 60s;
            grpc_send_timeout 60s;
        }
    }

    server {
        listen 8085;
        access_log /dev/stdout upstream buffer=64k flush=5s;

        location / {
            proxy_pass http://user_service_http;
            proxy_next_upstream error timeout http_502 http_503;
            proxy_connect_timeout 2s;
            proxy_read_timeout 60s;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }
    }
}
