scrape_configs:
  - job_name: 'otus-highload'
    scrape_interval: 5s
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['app:8080']

  - job_name: 'postgres-exporter'
    scrape_interval: 5s
    static_configs:
      - targets: ['postgres_exporter:9187']

  - job_name: 'postgres-exporter-slave1'
    scrape_interval: 5s
    static_configs:
      - targets: ['postgres_exporter_slave1:9187']

  - job_name: 'postgres-exporter-slave2'
    scrape_interval: 5s
    static_configs:
      - targets: ['postgres_exporter_slave2:9187']

  - job_name: 'node-exporter'
    scrape_interval: 5s
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'cadvisor'
    scrape_interval: 5s
    static_configs:
      - targets: ['cadvisor:8080']