scrape_configs:
  - job_name: 'otus-highload'
    scrape_interval: 5s
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['app:8080']

  - job_name: 'feed-ws'
    scrape_interval: 5s
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: ['feed-ws']
        type: A
        port: 8082

  - job_name: 'chat-service'
    scrape_interval: 5s
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['chat-service:8083']

  - job_name: 'auth-service'
    scrape_interval: 5s
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['auth-service:8084']

  - job_name: 'user-service'
    scrape_interval: 5s
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['user-service:8085']

  - job_name: 'post-service'
    scrape_interval: 5s
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['post-service:8086']

  - job_name: 'friend-service'
    scrape_interval: 5s
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['friend-service:8087']

  - job_name: 'feed-service'
    scrape_interval: 5s
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['feed-service:8089']

  - job_name: 'postgres-exporter'
    scrape_interval: 5s
    static_configs:
      - targets: ['postgres_exporter:9187']

  - job_name: 'postgres-exporter-worker1'
    scrape_interval: 5s
    static_configs:
      - targets: ['postgres_exporter_worker1:9187']

  - job_name: 'postgres-exporter-worker2'
    scrape_interval: 5s
    static_configs:
      - targets: ['postgres_exporter_worker2:9187']

  - job_name: 'postgres-exporter-worker3'
    scrape_interval: 5s
    static_configs:
      - targets: ['postgres_exporter_worker3:9187']

  - job_name: 'postgres-exporter-worker4'
    scrape_interval: 5s
    static_configs:
      - targets: ['postgres_exporter_worker4:9187']

  - job_name: 'node-exporter'
    scrape_interval: 5s
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'cadvisor'
    scrape_interval: 5s
    static_configs:
