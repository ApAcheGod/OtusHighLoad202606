pg_stat_app_queries_total_time:
  query: |
    SELECT
      queryid,
      left(query, 200) AS query,
      calls,
      total_exec_time,
      mean_exec_time,
      rows
    FROM pg_stat_statements
    WHERE userid = 'otus'::regrole
      AND calls > 1
      AND query !~* '(databasechangelog|pg_stat_statements|pg_catalog)'
      AND query !~* '^\s*(SET|SHOW|BEGIN|COMMIT|ROLLBACK|CREATE|ALTER|DROP|GRANT|REVOKE)(\s|$)'
      AND query !~* '^\s*select\s+(version|current_catalog|current_schema|current_database|string_agg|setting)(\s|\(|$)'
      AND query !~* '~\*'
    ORDER BY total_exec_time DESC
    LIMIT 20
  metrics:
    - queryid:
        usage: "LABEL"
        description: "Query ID"
    - query:
        usage: "LABEL"
        description: "Query text (first 200 chars)"
    - calls:
        usage: "COUNTER"
        description: "Number of times executed"
    - total_exec_time:
        usage: "COUNTER"
        description: "Total execution time (ms)"
    - mean_exec_time:
        usage: "GAUGE"
        description: "Mean execution time (ms)"
    - rows:
        usage: "COUNTER"
        description: "Total rows returned/affected"

pg_stat_app_queries_by_calls:
  query: |
    SELECT
      queryid,
      left(query, 200) AS query,
      calls,
      total_exec_time / 1000 AS total_time_sec,
      mean_exec_time,
      rows
    FROM pg_stat_statements
    WHERE userid = 'otus'::regrole
      AND calls > 1
      AND query !~* '(databasechangelog|pg_stat_statements|pg_catalog)'
      AND query !~* '^\s*(SET|SHOW|BEGIN|COMMIT|ROLLBACK|CREATE|ALTER|DROP|GRANT|REVOKE)(\s|$)'
      AND query !~* '^\s*select\s+(version|current_catalog|current_schema|current_database|string_agg|setting)(\s|\(|$)'
      AND query !~* '~\*'
    ORDER BY calls DESC
    LIMIT 20
  metrics:
    - queryid:
        usage: "LABEL"
        description: "Query ID"
    - query:
        usage: "LABEL"
        description: "Query text (first 200 chars)"
    - calls:
        usage: "COUNTER"
        description: "Number of times executed"
    - total_time_sec:
        usage: "COUNTER"
        description: "Total execution time (s)"
    - mean_exec_time:
        usage: "GAUGE"
        description: "Mean execution time (ms)"
    - rows:
        usage: "COUNTER"
        description: "Total rows returned/affected"

