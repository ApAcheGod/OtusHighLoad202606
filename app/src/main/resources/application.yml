server:
  port: 8080

spring:
  application:
    name: otus-highload
  http:
    client:
      connect-timeout: 2s
      read-timeout: 10s
  grpc:
    client:
      channel:
        default:
          target: localhost:9090
        user-service:
          target: localhost:9092
        post-service:
          target: localhost:9093
        friend-service:
          target: localhost:9094
        feed-service:
          target: localhost:9095
  liquibase:
    url: jdbc:postgresql://localhost:5432/otus_highload
    user: otus
    password: otus_pass
    change-log: classpath:/db/changelog/db.changelog-master.xml

app:
  chat-service:
    url: http://localhost:8083
  feed:
    max-size: 1000
  search:
    limit: 50
  datasource:
    url: jdbc:postgresql://localhost:5432/otus_highload
    username: otus
    password: otus_pass
    pool-size: 25
    connection-timeout: 5000

logging:
  structured:
    format:
      console: logstash

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
