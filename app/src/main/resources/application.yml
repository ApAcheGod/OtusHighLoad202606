server:
  port: 8080

spring:
  application:
    name: otus-highload
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2s
  liquibase:
    url: jdbc:postgresql://localhost:5432/otus_highload
    user: otus
    password: otus_pass
    change-log: classpath:/db/changelog/db.changelog-master.xml

app:
  dialog:
    storage: citus
  tarantool:
    host: localhost
    port: 3301
    username: app
    password: app_pass
  feed:
    max-size: 1000
  kafka:
    bootstrap-servers: localhost:9092
    send-timeout-ms: 10000
  search:
    limit: 50
  datasource:
    url: jdbc:postgresql://localhost:5432/otus_highload
    username: otus
    password: otus_pass
    pool-size: 25
    connection-timeout: 5000

logging:
  structured:
    format:
      console: logstash

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: 1.0

