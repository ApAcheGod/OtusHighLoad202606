x-citus-node: &citus-node
  image: citusdata/citus:14.2.0-pg16
  platform: linux/amd64
  environment: &citus-env
    POSTGRES_DB: otus_highload
    POSTGRES_USER: otus
    POSTGRES_PASSWORD: otus_pass
    PGPASSWORD: otus_pass
  entrypoint: ["/bin/bash", "-c"]
  command: &citus-command
    - |
      set -e
      install -m 600 -o postgres -g postgres /opt/citus-auth/pgpass /var/lib/postgresql/.pgpass
      exec docker-entrypoint.sh postgres \
        -c shared_preload_libraries=citus,pg_stat_statements \
        -c wal_level=logical \
        -c max_replication_slots=16 \
        -c max_wal_senders=16 \
        -c pg_stat_statements.max=10000 \
        -c pg_stat_statements.track=all \
        -c track_io_timing=on
  healthcheck: &citus-healthcheck
    test: ["CMD-SHELL", "pg_isready -U otus -d otus_highload"]
    interval: 5s
    timeout: 5s
    retries: 20
    start_period: 60s

services:
  citus-coordinator:
    <<: *citus-node
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/citus-init.sql:/docker-entrypoint-initdb.d/002-citus-init.sql:ro
      - ./postgres/.pgpass:/opt/citus-auth/pgpass:ro
      - citus_coordinator_data:/var/lib/postgresql/data

  citus-worker-1:
    <<: *citus-node
    ports:
      - "5433:5432"
    volumes:
      - ./postgres/citus-init.sql:/docker-entrypoint-initdb.d/002-citus-init.sql:ro
      - ./postgres/citus-worker-init.sql:/docker-entrypoint-initdb.d/003-citus-worker-init.sql:ro
      - ./postgres/.pgpass:/opt/citus-auth/pgpass:ro
      - citus_worker1_data:/var/lib/postgresql/data

  citus-worker-2:
    <<: *citus-node
    ports:
      - "5434:5432"
    volumes:
      - ./postgres/citus-init.sql:/docker-entrypoint-initdb.d/002-citus-init.sql:ro
      - ./postgres/citus-worker-init.sql:/docker-entrypoint-initdb.d/003-citus-worker-init.sql:ro
      - ./postgres/.pgpass:/opt/citus-auth/pgpass:ro
      - citus_worker2_data:/var/lib/postgresql/data

  citus-worker-3:
    <<: *citus-node
    ports:
      - "5435:5432"
    volumes:
      - ./postgres/citus-init.sql:/docker-entrypoint-initdb.d/002-citus-init.sql:ro
      - ./postgres/citus-worker-init.sql:/docker-entrypoint-initdb.d/003-citus-worker-init.sql:ro
      - ./postgres/.pgpass:/opt/citus-auth/pgpass:ro
      - citus_worker3_data:/var/lib/postgresql/data

  citus-worker-4:
    <<: *citus-node
    profiles: ["extra"]
    ports:
      - "5436:5432"
    volumes:
      - ./postgres/citus-init.sql:/docker-entrypoint-initdb.d/002-citus-init.sql:ro
      - ./postgres/citus-worker-init.sql:/docker-entrypoint-initdb.d/003-citus-worker-init.sql:ro
      - ./postgres/.pgpass:/opt/citus-auth/pgpass:ro
      - citus_worker4_data:/var/lib/postgresql/data

  citus-init:
    image: citusdata/citus:14.2.0-pg16
    platform: linux/amd64
    depends_on:
      citus-coordinator:
        condition: service_healthy
      citus-worker-1:
        condition: service_healthy
      citus-worker-2:
        condition: service_healthy
      citus-worker-3:
        condition: service_healthy
    environment:
      PGPASSWORD: otus_pass
      PGUSER: otus
      PGDATABASE: otus_highload
    restart: "no"
    command:
      - bash
      - -ceu
      - |
        for w in citus-worker-1 citus-worker-2 citus-worker-3; do
          echo "Registering $$w"
          psql -h citus-coordinator -v ON_ERROR_STOP=1 \
            -c "SELECT citus_add_node('$$w', 5432) WHERE NOT EXISTS (SELECT 1 FROM pg_dist_node WHERE nodename = '$$w' AND nodeport = 5432);"
        done
        psql -h citus-coordinator -v ON_ERROR_STOP=1 \
          -c "SELECT nodeid, nodename, nodeport, noderole, isactive FROM pg_dist_node ORDER BY nodename;"

  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:latest
    ports:
      - "9187:9187"
    environment:
      DATA_SOURCE_NAME: "postgresql://monitor:monitor_pass@citus-coordinator:5432/otus_highload?sslmode=disable"
      PG_EXPORTER_EXTEND_QUERY_PATH: /etc/postgres_exporter/queries.yml
    command:
      - "--no-collector.wal"
    volumes:
      - ./prometheus/postgres_exporter/queries.yml:/etc/postgres_exporter/queries.yml
    depends_on:
      citus-coordinator:
        condition: service_healthy

  postgres_exporter_worker1:
    image: prometheuscommunity/postgres-exporter:latest
    ports:
      - "9188:9187"
    environment:
      DATA_SOURCE_NAME: "postgresql://monitor:monitor_pass@citus-worker-1:5432/otus_highload?sslmode=disable"
      PG_EXPORTER_EXTEND_QUERY_PATH: /etc/postgres_exporter/queries.yml
    command:
      - "--no-collector.wal"
    volumes:
      - ./prometheus/postgres_exporter/queries.yml:/etc/postgres_exporter/queries.yml
    depends_on:
      citus-worker-1:
        condition: service_healthy

  postgres_exporter_worker2:
    image: prometheuscommunity/postgres-exporter:latest
    ports:
      - "9189:9187"
    environment:
      DATA_SOURCE_NAME: "postgresql://monitor:monitor_pass@citus-worker-2:5432/otus_highload?sslmode=disable"
      PG_EXPORTER_EXTEND_QUERY_PATH: /etc/postgres_exporter/queries.yml
    command:
      - "--no-collector.wal"
    volumes:
      - ./prometheus/postgres_exporter/queries.yml:/etc/postgres_exporter/queries.yml
    depends_on:
      citus-worker-2:
        condition: service_healthy

  postgres_exporter_worker3:
    image: prometheuscommunity/postgres-exporter:latest
    ports:
      - "9190:9187"
    environment:
      DATA_SOURCE_NAME: "postgresql://monitor:monitor_pass@citus-worker-3:5432/otus_highload?sslmode=disable"
      PG_EXPORTER_EXTEND_QUERY_PATH: /etc/postgres_exporter/queries.yml
    command:
      - "--no-collector.wal"
    volumes:
      - ./prometheus/postgres_exporter/queries.yml:/etc/postgres_exporter/queries.yml
    depends_on:
      citus-worker-3:
        condition: service_healthy

  # Метрики четвёртого воркера: нужен именно в момент решардинга, поэтому
  # тоже под профилем `extra`. Пока профиль не активен, таргет
  # postgres-exporter-worker4 в Prometheus горит DOWN — это ожидаемо.
  postgres_exporter_worker4:
    image: prometheuscommunity/postgres-exporter:latest
    profiles: ["extra"]
    ports:
      - "9191:9187"
    environment:
      DATA_SOURCE_NAME: "postgresql://monitor:monitor_pass@citus-worker-4:5432/otus_highload?sslmode=disable"
      PG_EXPORTER_EXTEND_QUERY_PATH: /etc/postgres_exporter/queries.yml
    command:
      - "--no-collector.wal"
    volumes:
      - ./prometheus/postgres_exporter/queries.yml:/etc/postgres_exporter/queries.yml
    depends_on:
      citus-worker-4:
        condition: service_healthy

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      APP_DATASOURCE_URL: jdbc:postgresql://citus-coordinator:5432/otus_highload
      APP_DATASOURCE_USERNAME: otus
      APP_DATASOURCE_PASSWORD: otus_pass
      SPRING_LIQUIBASE_URL: jdbc:postgresql://citus-coordinator:5432/otus_highload
      SPRING_LIQUIBASE_USER: otus
      SPRING_LIQUIBASE_PASSWORD: otus_pass
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      citus-init:
        condition: service_completed_successfully

  node-exporter:
    image: prom/node-exporter:latest
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    ports:
      - "8088:8080"
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    command:
      - --docker_only=true
      - --housekeeping_interval=10s

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./load-test/grafana:/etc/grafana/load-test-dashboards
    depends_on:
      - loki

  loki:
    image: grafana/loki:latest
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml
      - loki-data:/loki
    command: -config.file=/etc/loki/loki-config.yml

  promtail:
    image: grafana/promtail:latest
    volumes:
      - ./loki/promtail-config.yml:/etc/promtail/promtail-config.yml
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/promtail-config.yml
    depends_on:
      - loki

volumes:
  citus_coordinator_data:
  citus_worker1_data:
  citus_worker2_data:
  citus_worker3_data:
  citus_worker4_data:
  loki-data:
