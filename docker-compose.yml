x-citus-node: &citus-node
  image: otus-citus-arm64:14.2.0-pg16
  build:
    context: .
    dockerfile: postgres/Dockerfile.citus-arm64
  platform: linux/arm64
  environment: &citus-env
    POSTGRES_DB: otus_highload
    POSTGRES_USER: otus
    POSTGRES_PASSWORD: otus_pass
    PGPASSWORD: otus_pass
  entrypoint: ["/bin/bash", "-c"]
  command: &citus-command
    - |
      set -e
      install -m 600 -o postgres -g postgres /opt/citus-auth/pgpass /var/lib/postgresql/.pgpass
      exec docker-entrypoint.sh postgres \
        -c shared_preload_libraries=citus,pg_stat_statements \
        -c wal_level=logical \
        -c max_connections=300 \
        -c max_replication_slots=16 \
        -c max_wal_senders=16 \
        -c pg_stat_statements.max=10000 \
        -c pg_stat_statements.track=all \
        -c track_io_timing=on
  healthcheck: &citus-healthcheck
    test: ["CMD-SHELL", "pg_isready -U otus -d otus_highload"]
    interval: 5s
    timeout: 5s
    retries: 20
    start_period: 60s

services:
  citus-coordinator:
    <<: *citus-node
    command:
      - |
        set -e
        install -m 600 -o postgres -g postgres /opt/citus-auth/pgpass /var/lib/postgresql/.pgpass
        exec docker-entrypoint.sh postgres \
          -c shared_preload_libraries=citus,pg_stat_statements \
          -c wal_level=logical \
          -c max_connections=300 \
          -c max_replication_slots=16 \
          -c max_wal_senders=16 \
          -c pg_stat_statements.max=10000 \
          -c pg_stat_statements.track=all \
          -c track_io_timing=on \
          -c citus.max_shared_pool_size=32
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/citus-init.sql:/docker-entrypoint-initdb.d/002-citus-init.sql:ro
      - ./postgres/.pgpass:/opt/citus-auth/pgpass:ro
      - citus_coordinator_data:/var/lib/postgresql/data

    deploy:
      resources:
        limits:
          memory: 1200m
  citus-worker-1:
    <<: *citus-node
    ports:
      - "5433:5432"
    volumes:
      - ./postgres/citus-init.sql:/docker-entrypoint-initdb.d/002-citus-init.sql:ro
      - ./postgres/citus-worker-init.sql:/docker-entrypoint-initdb.d/003-citus-worker-init.sql:ro
      - ./postgres/.pgpass:/opt/citus-auth/pgpass:ro
      - citus_worker1_data:/var/lib/postgresql/data

    deploy:
      resources:
        limits:
          memory: 768m
  citus-worker-2:
    <<: *citus-node
    ports:
      - "5434:5432"
    volumes:
      - ./postgres/citus-init.sql:/docker-entrypoint-initdb.d/002-citus-init.sql:ro
      - ./postgres/citus-worker-init.sql:/docker-entrypoint-initdb.d/003-citus-worker-init.sql:ro
      - ./postgres/.pgpass:/opt/citus-auth/pgpass:ro
      - citus_worker2_data:/var/lib/postgresql/data

    deploy:
      resources:
        limits:
          memory: 768m
  citus-worker-3:
    <<: *citus-node
    ports:
      - "5435:5432"
    volumes:
      - ./postgres/citus-init.sql:/docker-entrypoint-initdb.d/002-citus-init.sql:ro
      - ./postgres/citus-worker-init.sql:/docker-entrypoint-initdb.d/003-citus-worker-init.sql:ro
      - ./postgres/.pgpass:/opt/citus-auth/pgpass:ro
      - citus_worker3_data:/var/lib/postgresql/data

    deploy:
      resources:
        limits:
          memory: 768m
  citus-worker-4:
    <<: *citus-node
    profiles: ["extra"]
    ports:
      - "5436:5432"
    volumes:
      - ./postgres/citus-init.sql:/docker-entrypoint-initdb.d/002-citus-init.sql:ro
      - ./postgres/citus-worker-init.sql:/docker-entrypoint-initdb.d/003-citus-worker-init.sql:ro
      - ./postgres/.pgpass:/opt/citus-auth/pgpass:ro
      - citus_worker4_data:/var/lib/postgresql/data

  citus-init:
    image: otus-citus-arm64:14.2.0-pg16
    build:
      context: .
      dockerfile: postgres/Dockerfile.citus-arm64
    platform: linux/arm64
    depends_on:
      citus-coordinator:
        condition: service_healthy
      citus-worker-1:
        condition: service_healthy
      citus-worker-2:
        condition: service_healthy
      citus-worker-3:
        condition: service_healthy
    environment:
      PGPASSWORD: otus_pass
      PGUSER: otus
      PGDATABASE: otus_highload
    restart: "no"
    command:
      - bash
      - -ceu
      - |
        for w in citus-worker-1 citus-worker-2 citus-worker-3; do
          echo "Registering $$w"
          psql -h citus-coordinator -v ON_ERROR_STOP=1 \
            -c "SELECT citus_add_node('$$w', 5432) WHERE NOT EXISTS (SELECT 1 FROM pg_dist_node WHERE nodename = '$$w' AND nodeport = 5432);"
        done
        psql -h citus-coordinator -v ON_ERROR_STOP=1 \
          -c "SELECT nodeid, nodename, nodeport, noderole, isactive FROM pg_dist_node ORDER BY nodename;"

  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:latest
    ports:
      - "9187:9187"
    environment:
      DATA_SOURCE_NAME: "postgresql://monitor:monitor_pass@citus-coordinator:5432/otus_highload?sslmode=disable"
      PG_EXPORTER_EXTEND_QUERY_PATH: /etc/postgres_exporter/queries.yml
    command:
      - "--no-collector.wal"
    volumes:
      - ./prometheus/postgres_exporter/queries.yml:/etc/postgres_exporter/queries.yml
    depends_on:
      citus-coordinator:
        condition: service_healthy

  postgres_exporter_worker1:
    image: prometheuscommunity/postgres-exporter:latest
    ports:
      - "9188:9187"
    environment:
      DATA_SOURCE_NAME: "postgresql://monitor:monitor_pass@citus-worker-1:5432/otus_highload?sslmode=disable"
      PG_EXPORTER_EXTEND_QUERY_PATH: /etc/postgres_exporter/queries.yml
    command:
      - "--no-collector.wal"
    volumes:
      - ./prometheus/postgres_exporter/queries.yml:/etc/postgres_exporter/queries.yml
    depends_on:
      citus-worker-1:
        condition: service_healthy

  postgres_exporter_worker2:
    image: prometheuscommunity/postgres-exporter:latest
    ports:
      - "9189:9187"
    environment:
      DATA_SOURCE_NAME: "postgresql://monitor:monitor_pass@citus-worker-2:5432/otus_highload?sslmode=disable"
      PG_EXPORTER_EXTEND_QUERY_PATH: /etc/postgres_exporter/queries.yml
    command:
      - "--no-collector.wal"
    volumes:
      - ./prometheus/postgres_exporter/queries.yml:/etc/postgres_exporter/queries.yml
    depends_on:
      citus-worker-2:
        condition: service_healthy

  postgres_exporter_worker3:
    image: prometheuscommunity/postgres-exporter:latest
    ports:
      - "9190:9187"
    environment:
      DATA_SOURCE_NAME: "postgresql://monitor:monitor_pass@citus-worker-3:5432/otus_highload?sslmode=disable"
      PG_EXPORTER_EXTEND_QUERY_PATH: /etc/postgres_exporter/queries.yml
    command:
      - "--no-collector.wal"
    volumes:
      - ./prometheus/postgres_exporter/queries.yml:/etc/postgres_exporter/queries.yml
    depends_on:
      citus-worker-3:
        condition: service_healthy

  postgres_exporter_worker4:
    image: prometheuscommunity/postgres-exporter:latest
    profiles: ["extra"]
    ports:
      - "9191:9187"
    environment:
      DATA_SOURCE_NAME: "postgresql://monitor:monitor_pass@citus-worker-4:5432/otus_highload?sslmode=disable"
      PG_EXPORTER_EXTEND_QUERY_PATH: /etc/postgres_exporter/queries.yml
    command:
      - "--no-collector.wal"
    volumes:
      - ./prometheus/postgres_exporter/queries.yml:/etc/postgres_exporter/queries.yml
    depends_on:
      citus-worker-4:
        condition: service_healthy

  kafka:
    image: apache/kafka:4.4.0
    environment:
      KAFKA_HEAP_OPTS: -Xmx512M -Xms512M
      KAFKA_CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 30s

    deploy:
      resources:
        limits:
          memory: 768m
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    ports:
      - "8080:8080"
    environment:
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=66.0 -XX:+UseCompactObjectHeaders
      APP_DATASOURCE_URL: jdbc:postgresql://citus-coordinator:5432/otus_highload
      APP_DATASOURCE_USERNAME: otus
      APP_DATASOURCE_PASSWORD: otus_pass
      SPRING_LIQUIBASE_URL: jdbc:postgresql://citus-coordinator:5432/otus_highload
      SPRING_LIQUIBASE_USER: otus
      SPRING_LIQUIBASE_PASSWORD: otus_pass
      APP_CHAT_SERVICE_URL: http://chat-service:8083
      APP_COUNTER_SERVICE_URL: http://counter-service:8090
      APP_INTERNAL_TOKEN: local-internal-token
      SPRING_GRPC_CLIENT_CHANNEL_DEFAULT_TARGET: auth-service:9090
      SPRING_GRPC_CLIENT_CHANNEL_USER_SERVICE_TARGET: user-nginx:9092
      SPRING_GRPC_CLIENT_CHANNEL_POST_SERVICE_TARGET: post-service:9093
      SPRING_GRPC_CLIENT_CHANNEL_FRIEND_SERVICE_TARGET: friend-service:9094
      SPRING_GRPC_CLIENT_CHANNEL_FEED_SERVICE_TARGET: feed-service:9095
      MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED: "false"
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "0.01"
      MANAGEMENT_TRACING_EXPORT_OTLP_ENABLED: "false"
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://tempo:4318/v1/traces
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
      start_interval: 1s
    depends_on:
      citus-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      chat-service:
        condition: service_started
      counter-service:
        condition: service_started
      auth-service:
        condition: service_started
      user-nginx:
        condition: service_started
      post-service:
        condition: service_started
      friend-service:
        condition: service_started
      feed-service:
        condition: service_started

    deploy:
      resources:
        limits:
          memory: 1152m
  chat-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: chat-service
    ports:
      - "8083:8083"
    environment:
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=66.0 -XX:+UseCompactObjectHeaders
      APP_TARANTOOL_HOST: tarantool
      APP_TARANTOOL_USERNAME: app
      APP_TARANTOOL_PASSWORD: app_pass
      APP_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      APP_INTERNAL_TOKEN: local-internal-token
      SPRING_GRPC_CLIENT_CHANNEL_DEFAULT_TARGET: auth-service:9090
      MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED: "false"
      MANAGEMENT_TRACING_EXPORT_OTLP_ENABLED: "false"
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://tempo:4318/v1/traces
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8083' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
      start_interval: 1s
    depends_on:
      tarantool:
        condition: service_healthy
      kafka:
        condition: service_healthy
      auth-service:
        condition: service_started

    deploy:
      resources:
        limits:
          memory: 512m
  counter-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: counter-service
    environment:
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=66.0 -XX:+UseCompactObjectHeaders
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATA_REDIS_HOST: counter-valkey
      SPRING_DATA_REDIS_PORT: "6379"
      APP_CHAT_SERVICE_URL: http://chat-service:8083
      APP_INTERNAL_TOKEN: local-internal-token
      MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED: "false"
      MANAGEMENT_TRACING_EXPORT_OTLP_ENABLED: "false"
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://tempo:4318/v1/traces
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8090' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
      start_interval: 1s
    depends_on:
      kafka:
        condition: service_healthy
      counter-valkey:
        condition: service_healthy
      chat-service:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 512m
  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: auth-service
    ports:
      - "8084:8084"
      - "9091:9090"
    environment:
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=66.0 -XX:+UseCompactObjectHeaders
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED: "false"
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "0.01"
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://tempo:4318/v1/traces
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9090' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
      start_interval: 1s
    depends_on:
      redis:
        condition: service_healthy

    deploy:
      resources:
        limits:
          memory: 512m
  user-db:
    image: postgres:16
    entrypoint: ["/bin/bash", "/replication/user-db-primary.sh"]
    environment:
      POSTGRES_USER: otus
      POSTGRES_PASSWORD: otus_pass
      POSTGRES_DB: users
    volumes:
      - ./postgres/user-db-init.sql:/docker-entrypoint-initdb.d/user-db-init.sql:ro
      - ./postgres/zz-replication-hba.sh:/docker-entrypoint-initdb.d/zz-replication-hba.sh:ro
      - ./postgres/user-db-primary.sh:/replication/user-db-primary.sh:ro
      - user_db_data:/var/lib/postgresql/data
    command:
      - "postgres"
      - "-c"
      - "wal_level=replica"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "max_replication_slots=10"
      - "-c"
      - "hot_standby=on"
      - "-c"
      - "wal_keep_size=1024"
      - "-c"
      - "max_connections=300"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U otus -d users"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

    deploy:
      resources:
        limits:
          memory: 256m
  user-db-slave-1:
    image: postgres:16
    entrypoint: ["/bin/bash", "/replication/standby-init.sh"]
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      PRIMARY_HOST: user-db
      REPLICA_USER: replica
      REPLICA_PASSWORD: replica_pass
      APPLICATION_NAME: user_db_slave_1
    volumes:
      - ./postgres/standby-init.sh:/replication/standby-init.sh:ro
      - user_db_slave1_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U otus -d users"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 60s
    depends_on:
      user-db:
        condition: service_healthy

    deploy:
      resources:
        limits:
          memory: 256m
  user-db-slave-2:
    image: postgres:16
    entrypoint: ["/bin/bash", "/replication/standby-init.sh"]
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      PRIMARY_HOST: user-db
      REPLICA_USER: replica
      REPLICA_PASSWORD: replica_pass
      APPLICATION_NAME: user_db_slave_2
    volumes:
      - ./postgres/standby-init.sh:/replication/standby-init.sh:ro
      - user_db_slave2_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U otus -d users"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 60s
    depends_on:
      user-db:
        condition: service_healthy

    deploy:
      resources:
        limits:
          memory: 256m
  user-haproxy:
    image: haproxy:3.4.7-alpine
    ports:
      - "54300:5000"
      - "5001:5001"
      - "8404:8404"
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    sysctls:
      - net.core.somaxconn=4096
      - net.ipv4.ip_local_port_range=10240 65535
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8404/ >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 12

    deploy:
      resources:
        limits:
          memory: 96m
  user-nginx:
    image: nginx:1.30.6-alpine
    ports:
      - "8085:8085"
      - "9092:9092"
    volumes:
      - ./nginx/user-service.conf:/etc/nginx/nginx.conf:ro
    sysctls:
      - net.core.somaxconn=4096
      - net.ipv4.ip_local_port_range=10240 65535
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8085/actuator/health 2>/dev/null | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
      start_interval: 1s
    depends_on:
      user-service-1:
        condition: service_started
      user-service-2:
        condition: service_started

    deploy:
      resources:
        limits:
          memory: 64m
  user-service-1:
    build:
      context: .
      dockerfile: Dockerfile
      target: user-service
    environment: &user-service-env
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=66.0 -XX:+UseCompactObjectHeaders
      APP_DATASOURCE_URL: jdbc:postgresql://user-haproxy:5000/users
      APP_DATASOURCE_SLAVE_URL: jdbc:postgresql://user-haproxy:5001/users
      APP_DATASOURCE_USERNAME: otus
      APP_DATASOURCE_PASSWORD: otus_pass
      MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED: "false"
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "0.01"
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://tempo:4318/v1/traces
    healthcheck: &user-service-healthcheck
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9092' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
      start_interval: 1s
    depends_on:
      user-haproxy:
        condition: service_healthy

    deploy:
      resources:
        limits:
          memory: 768m
  user-service-2:
    build:
      context: .
      dockerfile: Dockerfile
      target: user-service
    environment: *user-service-env
    healthcheck: *user-service-healthcheck
    depends_on:
      user-haproxy:
        condition: service_healthy

    deploy:
      resources:
        limits:
          memory: 768m
  post-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: post-service
    ports:
      - "8086:8086"
      - "9093:9093"
    environment:
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=66.0 -XX:+UseCompactObjectHeaders
      APP_DATASOURCE_URL: jdbc:postgresql://citus-coordinator:5432/otus_highload
      APP_DATASOURCE_USERNAME: otus
      APP_DATASOURCE_PASSWORD: otus_pass
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "8"
      APP_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED: "false"
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://tempo:4318/v1/traces
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9093' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
      start_interval: 1s
    depends_on:
      citus-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy

    deploy:
      resources:
        limits:
          memory: 512m
  friend-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: friend-service
    ports:
      - "8087:8087"
      - "9094:9094"
    environment:
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=66.0 -XX:+UseCompactObjectHeaders
      APP_DATASOURCE_URL: jdbc:postgresql://citus-coordinator:5432/otus_highload
      APP_DATASOURCE_USERNAME: otus
      APP_DATASOURCE_PASSWORD: otus_pass
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "8"
      SPRING_GRPC_CLIENT_CHANNEL_USER_SERVICE_TARGET: user-nginx:9092
      MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED: "false"
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://tempo:4318/v1/traces
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9094' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
      start_interval: 1s
    depends_on:
      citus-init:
        condition: service_completed_successfully
      user-nginx:
        condition: service_started

    deploy:
      resources:
        limits:
          memory: 512m
  feed-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: feed-service
    ports:
      - "8089:8089"
      - "9095:9095"
    environment:
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=66.0 -XX:+UseCompactObjectHeaders
      SPRING_DATA_REDIS_HOST: feed-redis
      SPRING_DATA_REDIS_PORT: "6379"
      APP_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_GRPC_CLIENT_CHANNEL_POST_SERVICE_TARGET: post-service:9093
      SPRING_GRPC_CLIENT_CHANNEL_FRIEND_SERVICE_TARGET: friend-service:9094
      MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED: "false"
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://tempo:4318/v1/traces
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9095' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
      start_interval: 1s
    depends_on:
      kafka:
        condition: service_healthy
      feed-redis:
        condition: service_healthy
      post-service:
        condition: service_started
      friend-service:
        condition: service_started

    deploy:
      resources:
        limits:
          memory: 640m
  feed-redis:
    image: redis:8.8.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

    deploy:
      resources:
        limits:
          memory: 128m
  feed-ws:
    build:
      context: .
      dockerfile: Dockerfile
      target: gateway
    environment:
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=66.0 -XX:+UseCompactObjectHeaders
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
    ports:
      - "8081:8082"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8082' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
      start_interval: 1s
    depends_on:
      citus-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy

    deploy:
      resources:
        limits:
          memory: 512m
  counter-valkey:
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - counter_valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 256m
  redis:
    image: redis:8.8.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

    deploy:
      resources:
        limits:
          memory: 128m
  tarantool:
    image: tarantool/tarantool:3
    entrypoint: ["env", "-u", "TT_APP_NAME", "-u", "TT_INSTANCE_NAME"]
    command: ["tarantool", "/opt/tarantool/init.lua"]
    working_dir: /var/lib/tarantool
    environment:
      TT_MEMTX_MEMORY: "2147483648"
    ports:
      - "3301:3301"
    volumes:
      - ./tarantool:/opt/tarantool:ro
      - tarantool_data:/var/lib/tarantool
    healthcheck:
      test: ["CMD", "tarantool", "-e", "local socket=require('socket'); local s=socket.tcp_connect('127.0.0.1',3301); if not s then os.exit(1) end; s:close(); os.exit(0, true)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

    deploy:
      resources:
        limits:
          memory: 2560m
  node-exporter:
    image: prom/node-exporter:latest
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    ports:
      - "8088:8080"
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    command:
      - --docker_only=true
      - --housekeeping_interval=10s

    deploy:
      resources:
        limits:
          memory: 256m
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

    deploy:
      resources:
        limits:
          memory: 448m
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./load-test/grafana:/etc/grafana/load-test-dashboards
    depends_on:
      - loki

    deploy:
      resources:
        limits:
          memory: 512m
  loki:
    image: grafana/loki:latest
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml
      - loki-data:/loki
    command: -config.file=/etc/loki/loki-config.yml

    deploy:
      resources:
        limits:
          memory: 512m
  tempo:
    image: grafana/tempo:latest
    ports:
      - "3200:3200"
      - "4318:4318"
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    command: -config.file=/etc/tempo/tempo.yaml

    deploy:
      resources:
        limits:
          memory: 768m
  promtail:
    image: grafana/promtail:latest
    volumes:
      - ./loki/promtail-config.yml:/etc/promtail/promtail-config.yml
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/promtail-config.yml
    depends_on:
      - loki

volumes:
  citus_coordinator_data:
  citus_worker1_data:
  citus_worker2_data:
  citus_worker3_data:
  citus_worker4_data:
  counter_valkey_data:
  redis_data:
  tarantool_data:
  user_db_data:
  user_db_slave1_data:
  user_db_slave2_data:
  loki-data:
  tempo_data:
