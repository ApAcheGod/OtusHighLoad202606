server:
  port: 8083

spring:
  application:
    name: chat-service
  grpc:
    client:
      channel:
        default:
          target: localhost:9090

app:
  internal-token: ${APP_INTERNAL_TOKEN:local-internal-token}
  tarantool:
    host: localhost
    port: 3301
    username: app
    password: app_pass
  kafka:
    bootstrap-servers: ${APP_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    send-timeout-ms: 10000
  counter:
    outbox-poll-ms: 100

logging:
  level:
    ru.otus.highload.chat.controller.DialogController: WARN
  structured:
    format:
      console: logstash

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  metrics:
    observations:
      ignored-meters: [LONG_TASK_TIMER]
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
