server:
  port: 8083

spring:
  application:
    name: chat-service
  grpc:
    client:
      channel:
        default:
          target: localhost:9090

app:
  tarantool:
    host: localhost
    port: 3301
    username: app
    password: app_pass

logging:
  structured:
    format:
      console: logstash

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
