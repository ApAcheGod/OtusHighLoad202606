server:
  port: 8084

spring:
  application:
    name: auth-service
  grpc:
    server:
      port: 9090
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2s

logging:
  structured:
    format:
      console: logstash

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
